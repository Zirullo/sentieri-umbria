<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b71c1c">
  <meta name="description" content="Sentieri CAI dell'Umbria con bussola di guida e avviso fuori sentiero, anche offline.">
  <title>Sentieri Umbria</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Ricerca e selezione -->
  <header class="topbar">
    <input id="search" type="search" placeholder="Cerca numero o nome" autocomplete="off" enterkeyhint="search">
    <button id="btn-filter" class="icon-btn" aria-label="Filtri">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18l-7 8.5V19l-4 2v-7.5Z"/></svg>
      <span id="filter-badge" class="badge" hidden></span>
    </button>
    <button id="btn-view" class="icon-btn" aria-label="Mostra elenco">☰</button>
  </header>

  <main>
    <div id="map"></div>
    <section id="list" class="list" hidden>
      <div class="seg" role="tablist">
        <button data-sort="zone" class="on">Per zona</button>
        <button data-sort="near">Vicino a me</button>
        <button data-sort="saved">Scaricati</button>
      </div>
      <button id="list-note" class="list-note" hidden></button>
      <div id="list-body"></div>
    </section>
    <button id="btn-layers" class="map-btn" aria-label="Tipo di mappa e legenda">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 8l10 5 10-5Z"/><path d="m2 13 10 5 10-5"/></svg>
    </button>
    <button id="btn-locate" class="fab" aria-label="La mia posizione">◎</button>
    <!-- Anteprima del sentiero toccato: dati principali, senza aprire la scheda -->
    <div id="peek" class="peek" hidden></div>
  </main>

  <!-- Filtri -->
  <section id="filters" class="sheet filters" hidden>
    <button class="sheet-close icon-btn" aria-label="Chiudi">✕</button>
    <div id="filters-body"></div>
  </section>

  <!-- Scheda del sentiero -->
  <section id="sheet" class="sheet" hidden>
    <button class="sheet-close icon-btn" aria-label="Chiudi">✕</button>
    <div id="sheet-body"></div>
  </section>

  <!-- Navigazione -->
  <section id="nav" class="nav" hidden>
    <div id="nav-map"></div>
    <div id="nav-banner" class="banner"></div>
    <button id="nav-layers" class="map-btn" aria-label="Tipo di mappa e legenda">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 8l10 5 10-5Z"/><path d="m2 13 10 5 10-5"/></svg>
    </button>
    <div class="nav-panel">
      <div class="compass-row">
        <div class="compass" id="compass">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="50" cy="50" r="47" class="ring"/>
            <g id="arrow"><path d="M50 8 L72 70 L50 58 L28 70 Z" class="arrow"/></g>
          </svg>
        </div>
        <div class="nav-stats">
          <div class="big" id="nav-target">–</div>
          <div class="small" id="nav-hint">In attesa del GPS…</div>
          <div class="stats">
            <div><span id="nav-done">–</span><small>fatti</small></div>
            <div><span id="nav-left">–</span><small>mancanti</small></div>
            <div><span id="nav-ele">–</span><small>quota</small></div>
          </div>
          <div class="dest" id="nav-dest">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path id="dest-arrow" d="M10 2 L15 17 L10 13 L5 17 Z"/></svg>
            <span id="nav-dest-text">Arrivo –</span>
          </div>
        </div>
      </div>
      <canvas id="profile" class="profile"></canvas>
      <div class="nav-buttons">
        <button id="nav-exit">✕ Esci</button>
        <button id="nav-reverse">⇄ Inverti</button>
        <button id="nav-center">◎ Centra</button>
      </div>
    </div>
  </section>

  <!-- Tipo di mappa e legenda -->
  <div id="map-panel" class="map-panel" hidden></div>

  <div id="toast" class="toast" hidden></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
