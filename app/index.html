<!doctype html>
<!-- Pagina di scelta. Le due app stanno in cartelle sorelle (piedi/, bici/): se una contenesse l'altra,
     Chrome su Android le confonderebbe all'installazione. Qui arrivano anche i vecchi link dell'app a piedi. -->
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Sentieri CAI, ciclovie e percorsi MTB dell'Umbria, con guida e avviso fuori percorso.">
  <title>Sentieri Umbria</title>
  <link rel="icon" href="piedi/icons/icon.svg" type="image/svg+xml">
  <script>
    // vecchi link: sentieri personali e ?reset/?sim vanno all'app a piedi, #percorso= a quella in bici
    (() => {
      const { hash, search } = location;
      if (hash.startsWith('#percorso=')) location.replace(`bici/${search}${hash}`);
      else if (hash.startsWith('#sentiero=') || search) location.replace(`piedi/${search}${hash}`);
    })();
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px 16px; display: flex; flex-direction: column; justify-content: center;
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1a1a1a; background: #f5f5f5;
    }
    main { width: 100%; max-width: 420px; margin: 0 auto; }
    h1 { margin: 0 0 4px; font-size: 26px; }
    p { margin: 0 0 20px; color: #5f6368; }
    a.app {
      display: flex; gap: 16px; align-items: center; margin-bottom: 12px; padding: 16px; border-radius: 16px;
      background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.15); color: inherit; text-decoration: none;
    }
    a.app img { width: 64px; height: 64px; border-radius: 14px; flex: none; }
    a.app b { display: block; font-size: 19px; }
    a.app span { color: #5f6368; font-size: 14px; }
    small { display: block; margin-top: 8px; color: #5f6368; }
  </style>
</head>
<body>
  <main>
    <h1>Sentieri Umbria</h1>
    <p>Scegli l'app: ognuna si installa sul telefono per conto suo.</p>
    <a class="app" href="piedi/">
      <img src="piedi/icons/icon-192.png" alt="">
      <div><b>A piedi</b><span>Sentieri CAI con bussola di guida e avviso fuori sentiero</span></div>
    </a>
    <a class="app" href="bici/">
      <img src="bici/icons/icon-192.png" alt="">
      <div><b>In bici</b><span>Ciclovie e percorsi MTB, con vibrazione e suono fuori percorso</span></div>
    </a>
    <small>Per installarla: apri l'app, poi menu ⋮ di Chrome → «Installa app».</small>
  </main>
  <script>
    // il vecchio service worker della cartella principale non serve più (vedi sw.js)
    navigator.serviceWorker?.getRegistrations().then((rs) => {
      for (const r of rs) if (r.scope === new URL('./', location.href).href) r.unregister();
    }).catch(() => {});
  </script>
</body>
</html>
